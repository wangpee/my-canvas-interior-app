<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ax3InteriAI - AI Interior Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>
    
    <style>
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
        @keyframes progress { 0% { transform: scaleX(0); } 50% { transform: scaleX(0.7); } 100% { transform: scaleX(0.9); } }
        .animate-progress { animation: progress 5s ease-out forwards; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
            Upload, Image: ImageIcon, Sparkles, RefreshCw, Download, 
            Layout, Palette, X, AlertCircle, Wand2, SlidersHorizontal, 
            Check, Plus, PaintBucket, ChevronDown, User, LogOut, Save, Grid, Trash2 
        } = LucideReact;

        // --- CONSTANTS ---
        const ROOM_TYPES = [
            { id: 'living_room', label: 'Living Room' },
            { id: 'bedroom', label: 'Bedroom' },
            { id: 'kitchen', label: 'Kitchen' },
            { id: 'office', label: 'Home Office' },
        ];

        const STYLES = [
            { id: 'modern', name: 'Modern Minimalist', color: 'bg-stone-100 text-stone-800', description: 'Clean lines and functional furniture.' },
            { id: 'boho', name: 'Bohemian Chic', color: 'bg-orange-50 text-orange-900', description: 'Eclectic, colorful, and organic.' },
            { id: 'industrial', name: 'Industrial Loft', color: 'bg-slate-200 text-slate-800', description: 'Raw materials and metal accents.' },
            { id: 'japandi', name: 'Japandi', color: 'bg-stone-200 text-stone-800', description: 'Japanese minimalism + Scandi function.' }
        ];

        // --- COMPONENTS ---

        const ComparisonSlider = ({ beforeImage, afterImage }) => {
            const [sliderPosition, setSliderPosition] = useState(50);
            const containerRef = useRef(null);
            const isDragging = useRef(false);

            const handleMove = (clientX) => {
                if (!isDragging.current || !containerRef.current) return;
                const rect = containerRef.current.getBoundingClientRect();
                const x = Math.max(0, Math.min(clientX - rect.left, rect.width));
                setSliderPosition((x / rect.width) * 100);
            };

            return (
                <div 
                    ref={containerRef}
                    className="relative w-full h-[400px] rounded-xl overflow-hidden cursor-ew-resize select-none shadow-lg border border-gray-200"
                    onMouseMove={(e) => handleMove(e.clientX)}
                    onMouseDown={() => { isDragging.current = true; }}
                    onMouseUp={() => { isDragging.current = false; }}
                    onMouseLeave={() => { isDragging.current = false; }}
                    onTouchMove={(e) => handleMove(e.touches[0].clientX)}
                    onTouchStart={() => { isDragging.current = true; }}
                    onTouchEnd={() => { isDragging.current = false; }}
                >
                    <img src={afterImage} className="absolute inset-0 w-full h-full object-cover" />
                    <div className="absolute inset-0 h-full overflow-hidden border-r-2 border-white" style={{ width: `${sliderPosition}%` }}>
                        <img src={beforeImage} className="absolute inset-0 w-full h-full object-cover" style={{ width: containerRef.current?.offsetWidth }} />
                        <div className="absolute top-4 left-4 bg-black/60 text-white text-[10px] font-bold px-2 py-1 rounded">ORIGINAL</div>
                    </div>
                    <div className="absolute top-0 bottom-0 w-1 bg-white flex items-center justify-center" style={{ left: `${sliderPosition}%` }}>
                        <div className="w-8 h-8 bg-white rounded-full flex items-center justify-center shadow-lg transform -translate-x-1/2">
                            <SlidersHorizontal className="w-4 h-4 text-indigo-600" />
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [appState, setAppState] = useState('landing');
            const [uploadedImage, setUploadedImage] = useState(null);
            const [generatedImages, setGeneratedImages] = useState([]);
            const [selectedStyle, setSelectedStyle] = useState(null);
            const [selectedRoomType, setSelectedRoomType] = useState(ROOM_TYPES[0].id);

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setUploadedImage(reader.result);
                        setAppState('styles');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const simulateGeneration = () => {
                setAppState('generating');
                // Simulate API Delay
                setTimeout(() => {
                    // For demo purposes, we use the uploaded image as the "result" 
                    // In the real app, this would be the base64 from Craw4AI
                    setGeneratedImages([uploadedImage, uploadedImage, uploadedImage]);
                    setAppState('results');
                }, 3000);
            };

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    {/* Header */}
                    <header className="bg-white border-b px-6 h-16 flex items-center justify-between sticky top-0 z-50">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => setAppState('landing')}>
                            <div className="bg-indigo-600 text-white p-1.5 rounded-lg"><Layout size={20} /></div>
                            <span className="font-bold text-xl">Ax3InteriAI</span>
                        </div>
                        <button className="text-sm font-medium text-gray-600 flex items-center gap-2 bg-gray-100 px-4 py-2 rounded-lg">
                            <User size={16} /> Login
                        </button>
                    </header>

                    <main className="flex-grow">
                        {appState === 'landing' && (
                            <div className="max-w-4xl mx-auto pt-20 text-center px-6 animate-fade-in">
                                <div className="w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-6">
                                    <Wand2 className="text-indigo-600" size={32} />
                                </div>
                                <h1 className="text-5xl font-bold mb-6">Redesign your room <span className="text-indigo-600">in seconds.</span></h1>
                                <p className="text-gray-600 text-lg mb-10">Upload a photo and let AI transform your space.</p>
                                
                                <div className="max-w-xs mx-auto mb-8">
                                    <select 
                                        className="w-full p-4 rounded-xl border border-gray-200 bg-white"
                                        value={selectedRoomType}
                                        onChange={(e) => setSelectedRoomType(e.target.value)}
                                    >
                                        {ROOM_TYPES.map(t => <option key={t.id} value={t.id}>{t.label}</option>)}
                                    </select>
                                </div>

                                <label className="inline-flex items-center gap-3 bg-gray-900 text-white px-8 py-4 rounded-full font-bold cursor-pointer hover:scale-105 transition-transform">
                                    <Upload size={20} /> Upload Photo
                                    <input type="file" className="hidden" onChange={handleImageUpload} />
                                </label>
                            </div>
                        )}

                        {appState === 'styles' && (
                            <div className="max-w-5xl mx-auto p-6 animate-fade-in">
                                <h2 className="text-2xl font-bold mb-6">Select a Style</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-10">
                                    {STYLES.map(s => (
                                        <div 
                                            key={s.id} 
                                            onClick={() => setSelectedStyle(s)}
                                            className={`p-6 rounded-2xl border-2 cursor-pointer transition-all ${selectedStyle?.id === s.id ? 'border-indigo-600 bg-indigo-50' : 'border-gray-100 bg-white'}`}
                                        >
                                            <div className={`w-10 h-10 rounded-full flex items-center justify-center mb-4 ${s.color}`}><Palette size={20} /></div>
                                            <h3 className="font-bold">{s.name}</h3>
                                            <p className="text-xs text-gray-500 mt-2">{s.description}</p>
                                        </div>
                                    ))}
                                </div>
                                <button 
                                    onClick={simulateGeneration}
                                    disabled={!selectedStyle}
                                    className="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold disabled:opacity-50"
                                >
                                    Generate Design
                                </button>
                            </div>
                        )}

                        {appState === 'generating' && (
                            <div className="flex flex-col items-center justify-center pt-40">
                                <div className="w-16 h-16 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-6"></div>
                                <h2 className="text-xl font-bold">AI is working its magic...</h2>
                                <p className="text-gray-500 mt-2">Transforming your {selectedRoomType.replace('_', ' ')}</p>
                            </div>
                        )}

                        {appState === 'results' && (
                            <div className="max-w-6xl mx-auto p-6 animate-fade-in">
                                <div className="flex justify-between items-end mb-6">
                                    <h2 className="text-3xl font-bold">Transformation Complete!</h2>
                                    <button onClick={() => setAppState('landing')} className="text-indigo-600 font-bold">Start Over</button>
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    <div className="lg:col-span-2">
                                        <ComparisonSlider beforeImage={uploadedImage} afterImage={generatedImages[0]} />
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm space-y-4">
                                        <h3 className="font-bold flex items-center gap-2"><PaintBucket size={18}/> Actions</h3>
                                        <button className="w-full py-3 bg-indigo-600 text-white rounded-lg font-bold flex items-center justify-center gap-2">
                                            <Save size={18} /> Save to Gallery
                                        </button>
                                        <button className="w-full py-3 bg-gray-900 text-white rounded-lg font-bold flex items-center justify-center gap-2">
                                            <Download size={18} /> Download
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="p-8 border-t text-center text-gray-400 text-sm">
                        © 2026 Ax3InteriAI. Powered by Craw4AI.
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
