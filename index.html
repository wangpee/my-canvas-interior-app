<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ax3InteriAI | AI Interior Design</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-storage-compat.js"></script>

    <style>
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.4s ease-out forwards; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // --- FIX: Extract Icons from window.lucideReact ---
        const { 
            Layout, Upload, Palette, Wand2, Save, Download, User, 
            LogOut, Check, X, SlidersHorizontal, Trash2, Sparkles, 
            RefreshCw, Plus, PaintBucket, ChevronDown, Grid, AlertCircle 
        } = window.lucideReact;

        const { useState, useEffect, useRef } = React;

        // --- FIREBASE CONFIGURATION ---
        // REPLACE THESE WITH YOUR KEYS FROM FIREBASE CONSOLE
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "interior-ff78b.firebaseapp.com",
            projectId: "interior-ff78b",
            storageBucket: "interior-ff78b.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();

        // --- COMPONENTS ---

        const ComparisonSlider = ({ beforeImage, afterImage }) => {
            const [sliderPosition, setSliderPosition] = useState(50);
            const containerRef = useRef(null);
            const isDragging = useRef(false);

            const handleMove = (clientX) => {
                if (!isDragging.current || !containerRef.current) return;
                const rect = containerRef.current.getBoundingClientRect();
                const x = Math.max(0, Math.min(clientX - rect.left, rect.width));
                setSliderPosition((x / rect.width) * 100);
            };

            return (
                <div 
                    ref={containerRef}
                    className="relative w-full h-[400px] rounded-2xl overflow-hidden cursor-ew-resize select-none shadow-2xl border border-gray-200"
                    onMouseMove={(e) => handleMove(e.clientX)}
                    onMouseDown={() => { isDragging.current = true; }}
                    onMouseUp={() => { isDragging.current = false; }}
                    onTouchMove={(e) => handleMove(e.touches[0].clientX)}
                >
                    <img src={afterImage} className="absolute inset-0 w-full h-full object-cover" />
                    <div className="absolute inset-0 h-full overflow-hidden border-r-4 border-white" style={{ width: `${sliderPosition}%` }}>
                        <img src={beforeImage} className="absolute inset-0 w-full h-full object-cover" style={{ width: containerRef.current?.offsetWidth }} />
                        <div className="absolute top-4 left-4 bg-black/60 text-white text-[10px] font-bold px-2 py-1 rounded backdrop-blur-md">BEFORE</div>
                    </div>
                    <div className="absolute top-0 bottom-0 w-1 bg-white flex items-center justify-center" style={{ left: `${sliderPosition}%` }}>
                        <div className="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-2xl transform -translate-x-1/2">
                            <SlidersHorizontal className="w-5 h-5 text-indigo-600" />
                        </div>
                    </div>
                    <div className="absolute top-4 right-4 bg-indigo-600 text-white text-[10px] font-bold px-2 py-1 rounded shadow-lg">AFTER (AI)</div>
                </div>
            );
        };

        function App() {
            const [user, setUser] = useState(null);
            const [appState, setAppState] = useState('landing');
            const [uploadedImage, setUploadedImage] = useState(null);
            const [generatedImages, setGeneratedImages] = useState([]);
            const [selectedStyle, setSelectedStyle] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [toast, setToast] = useState(null);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((u) => setUser(u));
                return () => unsubscribe();
            }, []);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            const handleLogin = async () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                try {
                    await auth.signInWithPopup(provider);
                    showToast("Welcome back!");
                } catch (e) { console.error(e); }
            };

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        setUploadedImage(ev.target.result);
                        setAppState('styles');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSaveDesign = async () => {
                if (!user) return handleLogin();
                setIsSaving(true);
                try {
                    const response = await fetch(uploadedImage);
                    const blob = await response.blob();
                    const filename = `design_${Date.now()}.jpg`;
                    const storageRef = storage.ref(`users/${user.uid}/designs/${filename}`);
                    
                    await storageRef.put(blob);
                    const url = await storageRef.getDownloadURL();
                    
                    await db.collection("users").doc(user.uid).collection("designs").add({
                        imageUrl: url,
                        storagePath: `users/${user.uid}/designs/${filename}`,
                        style: selectedStyle?.name || "Modern",
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    showToast("Design saved to cloud!");
                } catch (e) { 
                    console.error(e);
                    showToast("Failed to save.");
                } finally {
                    setIsSaving(false);
                }
            };

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-white/90 backdrop-blur-md border-b h-16 flex items-center justify-between px-8 sticky top-0 z-50">
                        <div className="flex items-center gap-2 font-black text-2xl text-indigo-600 cursor-pointer" onClick={() => setAppState('landing')}>
                            <Layout className="bg-indigo-600 text-white p-1 rounded-lg" size={28} /> Ax3InteriAI
                        </div>
                        <div>
                            {user ? (
                                <button onClick={() => auth.signOut()} className="flex items-center gap-2 text-sm font-bold text-red-500 bg-red-50 px-5 py-2 rounded-full">
                                    <LogOut size={16} /> Logout
                                </button>
                            ) : (
                                <button onClick={handleLogin} className="flex items-center gap-2 text-sm font-bold bg-indigo-600 text-white px-6 py-2 rounded-full shadow-lg">
                                    <User size={16} /> Sign In
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Main Section */}
                    <main className="flex-grow flex flex-col items-center justify-center p-6">
                        {appState === 'landing' && (
                            <div className="text-center max-w-3xl animate-fade-in">
                                <h1 className="text-6xl font-black mb-6 leading-tight">Elevate your space with <span className="text-indigo-600">AI precision.</span></h1>
                                <p className="text-gray-500 text-xl mb-12">Professional interior renders in seconds.</p>
                                <label className="bg-gray-900 text-white px-10 py-5 rounded-2xl font-bold text-xl cursor-pointer hover:scale-105 transition-transform shadow-2xl inline-flex items-center gap-4">
                                    <Upload /> Upload Room Photo
                                    <input type="file" className="hidden" onChange={handleImageUpload} />
                                </label>
                            </div>
                        )}

                        {appState === 'styles' && (
                            <div className="w-full max-w-5xl animate-fade-in">
                                <h2 className="text-3xl font-bold mb-8">Select Design Aesthetic</h2>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-6 mb-12">
                                    {['Modern', 'Minimalist', 'Industrial', 'Boho'].map(style => (
                                        <div 
                                            key={style}
                                            onClick={() => setSelectedStyle({name: style})}
                                            className={`p-10 rounded-3xl border-4 cursor-pointer text-center transition-all ${selectedStyle?.name === style ? 'border-indigo-600 bg-indigo-50 shadow-xl scale-105' : 'border-white bg-white'}`}
                                        >
                                            <Palette className="mx-auto mb-4 text-indigo-600" size={32} />
                                            <span className="font-bold text-lg">{style}</span>
                                        </div>
                                    ))}
                                </div>
                                <button 
                                    onClick={() => setAppState('results')}
                                    className="w-full py-6 bg-indigo-600 text-white rounded-3xl font-black text-2xl shadow-2xl hover:bg-indigo-700 disabled:opacity-20"
                                    disabled={!selectedStyle}
                                >
                                    GENERATE TRANSFORMATION
                                </button>
                            </div>
                        )}

                        {appState === 'results' && (
                            <div className="w-full max-w-6xl grid lg:grid-cols-3 gap-10 animate-fade-in">
                                <div className="lg:col-span-2">
                                    <ComparisonSlider beforeImage={uploadedImage} afterImage={uploadedImage} />
                                </div>
                                <div className="space-y-6">
                                    <div className="bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
                                        <h3 className="font-black text-xl mb-6 flex items-center gap-2"><Sparkles className="text-indigo-600"/> Design Ready</h3>
                                        <button onClick={handleSaveDesign} disabled={isSaving} className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold mb-4 flex items-center justify-center gap-2">
                                            {isSaving ? "Saving..." : <><Save size={20}/> Save to Cloud</>}
                                        </button>
                                        <button onClick={() => setAppState('landing')} className="w-full py-4 bg-gray-100 text-gray-700 rounded-2xl font-bold">Start New Project</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed bottom-8 right-8 bg-gray-900 text-white px-8 py-4 rounded-2xl shadow-2xl flex items-center gap-3 animate-fade-in z-[100]">
                            <Check className="text-green-400" /> <span className="font-bold">{toast}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
